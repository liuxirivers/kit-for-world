# ============================================
# RandomGift 随机世界礼包插件 配置文件
# ============================================

# 目标世界名称（留空则只在插件被启用的世界生效）
target-world: world

# 生成范围：以世界出生点为中心的方块半径（默认 1000×1000 区域）
spawn-range: 1000

# 单次周期生成礼包数量
spawn-count: 20

# 点券随机区间（最小值-最大值），{AMG} 占位符将替换为此范围内的随机整数
# 例如 5-25 表示随机 5~25 之间的整数
amount-given: 5-25

# 头盔方块 ID（Minecraft 1.21 材质名，如 CHEST、OAK_CHEST、NOTE_BLOCK 等）
# 使用 CHEST 时，客户端在 12 月会自动显示为圣诞礼物陷阱箱贴图
helmet-block: CHEST

# 礼包高亮开关（实体发光轮廓，玩家在渲染距离内即可看到）
# true  = 礼包带发光描边，方便玩家发现
# false = 关闭发光，仅显示方块贴图
# 修改后执行 /gift reload 会同步应用到已存在的礼包
glow-enabled: true

# 时间模式选择
# true  = 现实世界时间模式：使用 Java 标准时间 API，按现实天数计算周期
#        上次生成时间持久化保存到 gift-data.yml，重启服务器不丢失进度
# false = 游戏内 tick 时间模式：使用 BukkitRunnable tick 调度，按 MC 游戏天计算周期
use-real-time: false

# 生成周期（天）
# 现实时间模式：1 = 24 小时；游戏 tick 模式：1 = 1 个 MC 游戏天（20 分钟）
period-days: 3

# ============================================
# 奖励指令列表
# 支持占位符：
#   {player} - 玩家名称
#   {AMG}    - 在 amount-given 区间内随机得到的整数
# ============================================
commands:
  - give {player} diamond {AMG}
  - say 恭喜 {player} 获得了 {AMG} 颗钻石！